[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prudencia-dl"
version = "0.2.0"
description = "Certification DL niveau 2 - classification du risque AI Act avec JuriBERT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.3.0",
    "matplotlib==3.10.8",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "sentencepiece==0.2.0",
    "torch==2.2.2",
    "transformers==4.48.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
